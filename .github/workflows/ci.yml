name: Portfolio CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      DEPLOYMENT_ENV: preview
      SITE_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.12"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # braces (GHSA-vfj7-8cjw-p6xm) reaches only eslint-config-next's lint-time globbing and has no patched release yet.
      - name: Audit dependencies
        run: bun audit --ignore=GHSA-vfj7-8cjw-p6xm
      - name: Check types
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test
      - name: Build static site
        run: bun run build
      # The build regenerates tracked files such as app/fonts.css; any drift means a missed regeneration commit.
      - name: Check generated files are committed
        run: git diff --exit-code && test -z "$(git status --porcelain)"
      - name: Install browsers
        run: bunx playwright install --with-deps chromium firefox webkit
      # Regression budgets from the 2026-10-19 B1 baseline (docs/verification-log.md).
      - name: Check Lighthouse budgets
        run: bun run lighthouse
      - name: Test static output
        run: bun run test:e2e
      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
