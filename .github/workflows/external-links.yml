name: External links

# External sites change outside this repository, so this is a weekly report, not a required PR check.
on:
  schedule:
    - cron: "0 0 * * 1" # Monday 09:00 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEPLOYMENT_ENV: preview
      SITE_URL: ""
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.12"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build static site
        run: bun run build
      - name: Check external links
        id: links
        run: bun scripts/check-external-links.ts link-report.md
      - name: Report broken links in an issue
        if: ${{ failure() && steps.links.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "外部リンク切れの検出"
        # Reuse one open issue so a lasting outage does not open a new issue every week.
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file link-report.md
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file link-report.md; fi
